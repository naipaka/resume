<!-- ライト・ダークの切り替え。初回はブラウザの設定に合わせ、ボタンで選んだ表示は localStorage に保存する -->
<script>
  (function () {
    var storageKey = 'theme';
    var root = document.documentElement;

    function savedTheme() {
      try {
        var value = localStorage.getItem(storageKey);
        return value === 'light' || value === 'dark' ? value : null;
      } catch (e) {
        return null;
      }
    }

    function systemTheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    // 描画前に属性を付け、読み込み時にライト表示が一瞬見えるのを防ぐ
    root.setAttribute('data-theme', savedTheme() || systemTheme());

    document.addEventListener('DOMContentLoaded', function () {
      var header = document.querySelector('.page-header');
      if (!header) {
        return;
      }

      // 左に太陽、右に月を置いたスイッチ。つまみが今の表示の側に寄る
      var sunIcon =
        '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="12" cy="12" r="4"/>' +
        '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      var moonIcon =
        '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'theme-switch';
      button.setAttribute('role', 'switch');
      button.setAttribute('aria-label', 'ダークモード');
      button.innerHTML =
        '<span class="theme-switch__icon theme-switch__icon--sun">' + sunIcon + '</span>' +
        '<span class="theme-switch__icon theme-switch__icon--moon">' + moonIcon + '</span>' +
        '<span class="theme-switch__thumb" aria-hidden="true"></span>';

      function render() {
        var isDark = root.getAttribute('data-theme') === 'dark';
        button.setAttribute('aria-checked', isDark ? 'true' : 'false');
        button.setAttribute('title', isDark ? 'ライトモードに切り替える' : 'ダークモードに切り替える');
      }

      button.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try {
          localStorage.setItem(storageKey, next);
        } catch (e) {
          // 保存できない環境では、このページを開いている間だけ切り替える
        }
        render();
      });

      // ボタンで選んでいない間は、ブラウザの設定の変更に追従する
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (!savedTheme()) {
          root.setAttribute('data-theme', systemTheme());
          render();
        }
      });

      render();
      header.appendChild(button);
    });
  })();
</script>
