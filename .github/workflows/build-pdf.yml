name: build pdf

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build pdf and upload release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Ubuntu 23.10+ の AppArmor が非特権ユーザー名前空間を制限し、Chrome のサンドボックスが起動できないため解除する
      - name: allow unprivileged user namespaces for chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: build pdf
        run: npm run build:pdf
      - name: create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp docs/README.pdf "$RUNNER_TEMP/resume.pdf"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/resume.pdf" \
            --verify-tag \
            --title "Release $GITHUB_REF" \
            --notes ""
